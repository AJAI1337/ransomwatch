name: Collect intelligence and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: ransomware-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore most recent source snapshots
        uses: actions/cache/restore@v4
        with:
          path: site/data.json
          key: ransomware-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ransomware-snapshots-
      - run: node --test scripts/collect.test.mjs
      - run: node scripts/collect.mjs
      - uses: actions/cache/save@v4
        with:
          path: site/data.json
          key: ransomware-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
